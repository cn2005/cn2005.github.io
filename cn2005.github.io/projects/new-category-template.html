<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新分区模板 | 陈诺作品集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../styles.css" />
  <script src="../script.js" defer></script>
</head>
<body>
  <canvas class="field-canvas" data-field-canvas aria-hidden="true"></canvas>
  <div class="scanline" aria-hidden="true"></div>
  <main class="case-page">
    <a class="back-link" href="../index.html#projects">返回作品</a>

    <header class="case-hero single">
      <div class="case-title">
        <p class="eyebrow">New Category</p>
        <h1>分区名称</h1>
        <p class="case-lead template-note">复制本页并修改标题、简介与作品条目，即可新增作品分区。</p>
      </div>
    </header>

    <section class="project-list" aria-label="模板作品列表">
      <article class="project-item">
        <h3>作品标题 01</h3>
        <p>填写该作品的核心目标、技术实现与展示要点。</p>
      </article>
      <article class="project-item">
        <h3>作品标题 02</h3>
        <p>可以继续追加截图、视频链接和技术难点说明。</p>
      </article>
      <article class="project-item">
        <h3>作品标题 03</h3>
        <p>保持信息短、准、可浏览，让分区页承担目录作用。</p>
      </article>
    </section>
  </main>
</body>
</html>
